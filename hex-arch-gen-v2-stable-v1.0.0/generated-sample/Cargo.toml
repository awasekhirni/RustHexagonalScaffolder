[package]
name = "generated-api"
version = "0.1.0"
edition = "2021"
description = "Hexagonal REST API generated by hex-gen v2 from a PostgreSQL schema (db-first)."
publish = false

[[bin]]
name = "generated_api"
path = "src/main.rs"

[lib]
name = "generated_api"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit", "compression-gzip", "request-id", "util"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "migrate", "json", "rust_decimal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability: structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Common types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
once_cell = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# OpenAPI / Swagger — utoipa 5 emits OpenAPI 3.0.3 natively. The generated
# `api/openapi.rs` includes a `to_3_1()` post-processor that upgrades the
# serialised document to 3.1 at serve-time (sets `openapi: "3.1.0"`, adds
# `jsonSchemaDialect`, injects `webhooks`). Closes G-C01 without depending
# on the unreleased utoipa 6 alpha.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# GraphQL — v0.3.0 (closes G-C02). async-graphql 7 with the axum
# integration provides SDL embedding, Query/Mutation roots, DataLoader
# batching, WebSocket Subscriptions, and Apollo Federation v2. The
# generated code currently uses Query + Mutation + SDL; Subscriptions
# and Federation entity resolvers land in v0.4.0.
# Features:
#   - chrono, uuid: OutputType impls for chrono::DateTime / uuid::Uuid
#   - decimal:      OutputType impl for rust_decimal::Decimal
#   - tracing:      per-resolver span instrumentation
async-graphql = { version = "7", features = ["chrono", "uuid", "decimal", "tracing"] }
async-graphql-axum = "7"

# Telemetry — v0.4.0 (closes G-H08). Prometheus registry for the
# `/metrics` endpoint. Opt-in via `PROMETHEUS_METRICS_ENABLED=true`.
prometheus = "0.13"

# Cursor pagination + idempotency checksum
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# Pin zip to 2.2.x — utoipa-swagger-ui 8.x's build script uses the older
# non-generic `ZipFile` API that broke in zip 2.5+. See ERROR_INVENTORY.md.
zip = "~2.2"

# Money value object — fixed-point decimal
rust_decimal = { version = "1.36", features = ["serde-with-str"] }

# Cancellation tokens for graceful shutdown
tokio-util = "0.7"

# ── security / auth ──────────────────────────────────────────────────────
# JWT issue/verify
jsonwebtoken = "9"
# Webhook HMAC-SHA256 signing
hmac = "0.12"
# SecretString zeroizes its buffer on drop
zeroize = "1.8"

# ── resilience / chaos ───────────────────────────────────────────────────
# Chaos-engineering random sampling (only used when APP__CHAOS__ENABLED=true)
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
